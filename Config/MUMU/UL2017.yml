Info:
  Era: 2017
  Trigger: [HLT_Mu50, HLT_TkMu100, HLT_OldMu100]

ObjectProducer:
  - Type: LHEProducer
    Name: LHEContentMaker
    OutputName: LHECollection
    LeadingPt: 52
    SubleadingPt: 50
    Eta: 2.4
    Pid: 13

  - Type: DressedLeptonProducer
    Name: DressedLeptonProducer
    OutputName: DressedMuons
    LeadingPt: 52
    SubleadingPt: 50
    Eta: 2.4
    Pid: 13

  - Type: GenJetProducer
    Name: GenJetProducer
    OutputName: GenJetsJERC
    Eta: 2.7
    Pt: 5
    Veto: None

  - Type: GenJetProducer
    Name: GenJetProducer
    OutputName: GenJets
    Eta: 2.5
    Pt: 30
    Veto: DressedMuons

  - Type: RawMuonProducer
    Name: RawMuonMaker
    OutputName: RawMuons
    Eta: 2.4
    Id: global
    Iso: 0.1

  - Type: RawJetProducer
    Name: RawJetProducer
    OutputName: RawJets
    Eta: 2.5
    Id: 2 # 2 bit -> TightLepVeto, 1 bit -> Tight, 0 bit -> Loose
    BTagWP: M
    Path: ../../Correctionlib/jet/bTag/2017.json

  - Type: ZbosonProducer
    Name: OSMuonPairMaker
    OutputName: MuonPair_Nominal
    src: RawMuons
    LeadingMuonPt: 52
    SubLeadingMuonPt: 50
    IsolationConj: 2
    ChargeConj: -1
    Correction:
      MuonMomentumCorrection:
        Type: MuonMomentumCorrectionFactory
        Name: MuonMomentumCorrectionFactory
        MuonSmearing:
          barrel:
            smearing: -1
            sigma: 0.0104 +6.11e-5 * x -3.31e-8 * x^2 + 6.73e-12 * x^3
          endcap:
            smearing: 0.3202
            sigma: 0.0121 + 5.92e-5 * x -2.61e-8 * x^2 + 5.11e-12 * x^3
        MuonScaling:
          Default: ../../Correctionlib/muon/scaling/MuonScaling_2017.json
          Variation: ../../Correctionlib/muon/scaling/MuonScalingVariation_2017.json

  - Type: JetProducer
    Name: JetProducer
    OutputName: NominalJets
    src: RawJets
    MCsrc: GenJetsJERC
    Pt: 30
    PUId: 4
    Correction:
      JetEnergyCorrection:
        Type: JetEnergyCorrectionFactory
        Name: JetEnergyCorrectionFactory
        JERC: ../../Correctionlib/jet/JERC/JERC_2017.json

EfficinecyFactory:
  - Type: RecoMuonEfficiencyFactory
    Name: MuonReco
    Path: ../../Correctionlib/muon/efficiency/ScaleFactors_Muon_highPt_RECO_2017_schemaV2.json
    SystPath: ../../Correctionlib/muon/efficiency/syst_variation/2017/Reco.json
    GetPath: NUM_GlobalMuons_DEN_TrackerMuonProbes
  
  - Type: SingleMuonEfficiencyFactory
    Name: MuonId
    Path: ../../Correctionlib/muon/efficiency/ScaleFactors_Muon_highPt_IDISO_2017_schemaV2.json
    SystPath: ../../Correctionlib/muon/efficiency/syst_variation/2017/ID.json
    GetPath: NUM_HighPtID_DEN_GlobalMuonProbes
  
  - Type: SingleMuonEfficiencyFactory
    Name: MuonIso
    Path: ../../Correctionlib/muon/efficiency/ScaleFactors_Muon_highPt_IDISO_2017_schemaV2.json
    SystPath: ../../Correctionlib/muon/efficiency/syst_variation/2017/ISO.json
    GetPath: NUM_probe_LooseRelTkIso_DEN_HighPtProbes
  
  - Type: MuonTriggerEfficiencyFactory
    Name: MuonTrigger
    Path: ../../Correctionlib/muon/efficiency/ScaleFactors_Muon_highPt_HLT_2017_schemaV2.json
    SystPath: ../../Correctionlib/muon/efficiency/syst_variation/2017/Trigger.json
    Data: NUM_HLT_DEN_HighPtLooseRelIsoProbes_DATAeff
    MC: NUM_HLT_DEN_HighPtLooseRelIsoProbes_MCeff
  
  - Type: JetPUIdEfficiencyFactory
    Name: JetPU
    Path: ../../Correctionlib/jet/JetPUID/2017.json

  - Type: BTagEffcieincyFactory
    Name: BTag
    EfficiencyPath: ../../Correctionlib/jet/bTag/eff/BTagEff_MUMU_eff_AbsEta_PtMerged.json
    SFPath: ../../Correctionlib/jet/bTag/2017.json

  - Type: TopPtReweightingFactory
    Name: TopPtReweighting
    Formula: exp(0.0615 - 0.0005 * x)

  - Type: PileUpReweightingFactory
    Name: PileUpReweighting
    DataPath: ../../PileupInfo/PileupHistogram-goldenJSON-13tev-2017-69200ub-99bins.root
    DataUp: ../../PileupInfo/PileupHistogram-goldenJSON-13tev-2017-72400ub-99bins.root
    DataDown: ../../PileupInfo/PileupHistogram-goldenJSON-13tev-2017-66000ub-99bins.root
    MCPath: ../../PileupInfo/MC_2017.root

  - Type: L1PrefiringFactory
    Name: L1Prefiring
    
    
