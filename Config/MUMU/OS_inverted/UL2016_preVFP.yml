Info:
  Era: 2016_preVFP
  Trigger: [HLT_Mu50, HLT_TkMu50]

ObjectProducer:
  - Type: LHEProducer
    Name: LHEContentMaker
    OutputName: LHECollection
    LeadingPt: 52
    SubleadingPt: 50
    Eta: 2.4
    Pid: 13

  - Type: DressedLeptonProducer
    Name: DressedLeptonProducer
    OutputName: DressedMuons
    LeadingPt: 52
    SubleadingPt: 50
    Eta: 2.4
    Pid: 13

  - Type: GenJetProducer
    Name: GenJetProducer
    OutputName: GenJetsJERC
    Eta: 2.7
    Pt: 5
    Veto: None

  - Type: GenJetProducer
    Name: GenJetProducer
    OutputName: GenJets
    Eta: 2.5
    Pt: 30
    Veto: DressedMuons

  - Type: RawMuonProducer
    Name: RawMuonMaker
    OutputName: RawMuons
    Eta: 2.4
    Id: global
    Iso: 0.1

  - Type: RawJetProducer
    Name: RawJetProducer
    OutputName: RawJets
    Eta: 2.5
    Id: 2 # 2 bit -> TightLepVeto, 1 bit -> Tight, 0 bit -> Loose
    BTagWP: M
    Path: ../../Correctionlib/jet/bTag/2016preVFP.json

  - Type: ZbosonProducer
    Name: OSMuonPairMaker
    OutputName: MuonPair_Nominal
    src: RawMuons
    LeadingMuonPt: 52
    SubLeadingMuonPt: 50
    IsolationConj: 0
    ChargeConj: -1
    Correction:
      MuonMomentumCorrection:
        Type: MuonMomentumCorrectionFactory
        Name: MuonMomentumCorrectionFactory
        MuonSmearing:
          barrel:
            smearing: -1
            sigma: 0.0112 + 6.87e-5 * x -3.88e-8 * x^2 + 9.03e-12 * x^3
          endcap:
            smearing: -1
            sigma: 0.013 + 6.93e-5 * x -3.46e-8 * x^2 + 7.72e-12 * x^3
        MuonScaling:
          Default: ../../Correctionlib/muon/scaling/MuonScaling_2016preVFP.json
          Variation: ../../Correctionlib/muon/scaling/MuonScalingVariation_2016preVFP.json

  - Type: JetProducer
    Name: JetProducer
    OutputName: NominalJets
    src: RawJets
    MCsrc: GenJetsJERC
    Pt: 30
    PUId: 1
    Correction:
      JetEnergyCorrection:
        Type: JetEnergyCorrectionFactory
        Name: JetEnergyCorrectionFactory
        JERC: ../../Correctionlib/jet/JERC/JERC_2016preVFP.json

EfficinecyFactory:
  - Type: RecoMuonEfficiencyFactory
    Name: MuonReco
    Path: ../../Correctionlib/muon/efficiency/ScaleFactors_Muon_highPt_RECO_2016_preVFP_schemaV2.json
    SystPath: ../../Correctionlib/muon/efficiency/syst_variation/2016_preVFP/Reco.json
    GetPath: NUM_GlobalMuons_DEN_TrackerMuonProbes
  
  - Type: SingleMuonEfficiencyFactory
    Name: MuonId
    Path: ../../Correctionlib/muon/efficiency/ScaleFactors_Muon_highPt_IDISO_2016_preVFP_schemaV2.json
    SystPath: ../../Correctionlib/muon/efficiency/syst_variation/2016_preVFP/ID.json
    GetPath: NUM_HighPtID_DEN_GlobalMuonProbes
  
  - Type: JetPUIdEfficiencyFactory
    Name: JetPU
    Path: ../../Correctionlib/jet/JetPUID/2016preVFP.json

  - Type: BTagEffcieincyFactory
    Name: BTag
    EfficiencyPath: ../../Correctionlib/jet/bTag/eff/BTagEff_MUMU_eff_AbsEta_PtMerged.json
    SFPath: ../../Correctionlib/jet/bTag/2016preVFP.json

  - Type: TopPtReweightingFactory
    Name: TopPtReweighting
    Formula: exp(0.0615 - 0.0005 * x)

  - Type: PileUpReweightingFactory
    Name: PileUpReweighting
    DataPath: ../../PileupInfo/PileupHistogram-goldenJSON-13tev-2016-preVFP-69200ub-99bins.root
    DataUp: ../../PileupInfo/PileupHistogram-goldenJSON-13tev-2016-preVFP-72400ub-99bins.root
    DataDown: ../../PileupInfo/PileupHistogram-goldenJSON-13tev-2016-preVFP-66000ub-99bins.root
    MCPath: ../../PileupInfo/MC_2016.root

  - Type: L1PrefiringFactory
    Name: L1Prefiring
    
Systematics:
  - Name: Nominal
    SystType: None
    Iter: 1
    Path: [era, sample, OS_inverted]
    MuonSrc: MuonPair_Nominal
    JetSrc: NominalJets
    Detail: false

  - Name: TopPtReweighting
    target: TopPtReweighting
    input: None
    SystType: EfficiencyVariation
    Iter: 1
    Path: [era, sample, OS_inverted, syst, TopPtReweighting]
    MuonSrc: MuonPair_Nominal
    JetSrc: NominalJets
    Detail: false


