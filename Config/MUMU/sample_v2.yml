  - Name: JetEnergyScaleSyst_HF
    input: HF
    SystType: JetSelection
    Iter: 2
    Path: [era, sample, syst, JetEnergyScale_HF]
    MuonSrc: dummy
    JetSrc: Jets_ScaleSyst_HF

  - Name: JetEnergyScaleSyst_BBEC1
    input: BBEC1
    SystType: JetSelection
