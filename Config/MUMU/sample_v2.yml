  - Name: JetEnergyScaleSyst_Absolute
    input: Absolute
    SystType: JetSelection
    Iter: 2
    Path: [era, sample, syst, JetEnergyScale_Absolute]
    MuonSrc: dummy
    JetSrc: Jets_ScaleSyst_Absolute

  - Name: JetEnergyScaleSyst_RelativeSample_Uncor
    input: RelativeSample_Uncor
    SystType: JetSelection
    Iter: 2
    Path: [era, sample, syst, JetEnergyScale_RelativeSample_Uncor]
    MuonSrc: dummy
    JetSrc: Jets_ScaleSyst_RelativeSample_Uncor

  - Name: JetEnergyScaleSyst_HF_Uncor
    input: HF_Uncor
    SystType: JetSelection
    Iter: 2
    Path: [era, sample, syst, JetEnergyScale_HF_Uncor]
    MuonSrc: dummy
    JetSrc: Jets_ScaleSyst_HF_Uncor

  - Name: JetEnergyScaleSyst_BBEC1_Uncor
    input: BBEC1_Uncor
    SystType: JetSelection
    Iter: 2
    Path: [era, sample, syst, JetEnergyScale_BBEC1_Uncor]
    MuonSrc: dummy
    JetSrc: Jets_ScaleSyst_BBEC1_Uncor

  - Name: JetEnergyScaleSyst_EC2_Uncor
    input: EC2_Uncor
    SystType: JetSelection
    Iter: 2
    Path: [era, sample, syst, JetEnergyScale_EC2_Uncor]
    MuonSrc: dummy
